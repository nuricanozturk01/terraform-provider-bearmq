# golangci-lint v2 config (schema version 2). Requires golangci-lint >= v2.0.
version: "2"

run:
  timeout: 5m

linters:
  enable:
    - govet
    - errcheck
    - staticcheck   # v2 folds in gosimple + stylecheck
    - unused
    - ineffassign
    - misspell
    - revive
    - unconvert
    - bodyclose
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck

# gofmt / goimports are formatters in v2, not linters.
formatters:
  enable:
    - gofmt
    - goimports
